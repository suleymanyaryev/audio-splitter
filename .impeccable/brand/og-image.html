<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Audio Splitter og-image</title>
<style>
  @font-face {
    font-family: "Albert Sans";
    src: url("../../src/app/styles/fonts/albert-sans-variable.woff2") format("woff2");
    font-weight: 400 700;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background: #E3E8E6; font-family: "Albert Sans", sans-serif; position: relative; }
  header { position: absolute; left: 0; top: 0; width: 1200px; height: 96px; background: #26343A;
    display: flex; align-items: center; padding-left: 64px; gap: 16px; }
  .mark { width: 40px; height: 40px; border-radius: 50%; background: #BCD2CD; position: relative; }
  .mark::after { content: ""; position: absolute; left: 14px; top: 14px; width: 12px; height: 12px;
    border-radius: 50%; background: #26343A; }
  header b { font-size: 32px; font-weight: 700; color: #E6EEEC; letter-spacing: -0.2px; }
  h1 { position: absolute; left: 64px; top: 120px; width: 1072px; font-size: 44px; line-height: 56px;
    font-weight: 600; color: #1B2326; letter-spacing: -0.4px; }
  h1 span { display: block; }
  p { position: absolute; left: 64px; top: 240px; font-size: 26px; line-height: 32px; color: #55615E; font-weight: 500; }
  .panel { position: absolute; left: 64px; top: 296px; width: 1072px; height: 176px; background: #FAFBFA;
    border: 1px solid #D2D9D6; border-radius: 4px; }
  .strip { position: absolute; left: 64px; top: 496px; width: 1072px; height: 64px; background: #BCD2CD; border-radius: 4px; }
  .abs { position: absolute; }
  .gap { background: #BCD2CD; }
  .bar { background: #2C3639; width: 2px; }
  .rule { background: #B83E0B; width: 2px; }
  .num { color: #B83E0B; font-size: 16px; font-weight: 700; line-height: 20px; width: 24px; text-align: center; }
  .blk { background: #3B4F57; border-radius: 3px; }
</style>
</head>
<body>
<header><div class="mark"></div><b>Audio Splitter</b></header>
<h1><span>One long audio file in, one file per track out.</span><span>Nothing is uploaded.</span></h1>
<p>Runs entirely in your browser</p>
<div class="panel" id="panel"></div>
<div class="strip" id="strip"></div>
<script>
// Deterministic pseudo-random (mulberry32): the same bars on every render.
function rng(seed) {
  return () => {
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = rng(20240607);
const W = 1040;            // inner width shared by wave and strip (16 px padding in 1072)
const splits = [280, 544, 808];   // x of the split rules, inside the inner width
const GAP = 32;            // sea-mist gap band width around each split
const level = [0.78, 0.55, 0.9, 0.66];
const waveTop = 40, waveH = 120, mid = waveTop + waveH / 2;
const panel = document.getElementById("panel");
const strip = document.getElementById("strip");
function add(parent, cls, x, y, w, h, text) {
  const d = document.createElement("div");
  d.className = "abs " + cls;
  d.style.cssText = `left:${x}px;top:${y}px;` + (w ? `width:${w}px;` : "") + (h ? `height:${h}px;` : "");
  if (text) d.textContent = text;
  parent.appendChild(d);
}
// Panel border is 1 px, so absolute children start at the padding box (+1 offset is absorbed below).
splits.forEach((s) => add(panel, "gap", 16 + s - GAP / 2, waveTop - 4, GAP, waveH + 8));
let env = 0.5;
for (let x = 0; x < W; x += 3) {
  const near = splits.some((s) => Math.abs(x - s) < GAP / 2);
  const t = splits.filter((s) => s <= x).length;
  env += (rand() - 0.5) * 0.35;
  env = Math.min(1, Math.max(0.25, env));
  const amp = near ? 0.04 + rand() * 0.05 : level[t] * env * (0.55 + rand() * 0.45);
  const h = Math.max(2, Math.round(amp * waveH / 2) * 2);
  add(panel, "bar", 16 + x, mid - h / 2, 2, h);
}
splits.forEach((s, i) => {
  add(panel, "rule", 16 + s - 1, waveTop - 4, 2, waveH + 8);
  add(panel, "num", 16 + s - 12, 12, 24, 20, String(i + 1));
});
const edges = [0, ...splits, W];
for (let i = 0; i < 4; i++) {
  const a = edges[i] + (i ? 8 : 0), b = edges[i + 1] - (i < 3 ? 8 : 0);
  add(strip, "blk", 16 + a, 12, b - a, 40);
}
splits.forEach((s) => add(strip, "rule", 16 + s - 1, 12, 2, 40));
</script>
</body>
</html>
