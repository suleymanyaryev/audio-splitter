name: Deploy to GitHub Pages

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The full history, so the next step can tell whether the tag is on main.
          fetch-depth: 0

      # Only a release cut from main is published; a tag on another branch stops here.
      - name: Check the tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      # Keep the Node major in step with mise.toml, which setup-node does not read.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck and test
        run: |
          pnpm typecheck
          pnpm test

      # The site is served from /<repo>/, so every asset URL needs that prefix.
      - name: Build
        run: pnpm build-only --base="/${{ github.event.repository.name }}/"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
