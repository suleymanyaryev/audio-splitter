<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Splitter – Split long audio files into tracks</title>
    <meta name="description" content="Split one long audio file into separate tracks. It proposes the cuts, you check them by eye and ear, and nothing is uploaded: it all runs in your browser.">
    <link rel="canonical" href="https://suleymanyaryev.github.io/audio-splitter/">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#26343a" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0b1012" media="(prefers-color-scheme: dark)">

    <!-- Themes the page before it first paints. Same key and fallback as src/shared/lib/theme/theme.ts. -->
    <script>
      (function () {
        var saved = null
        try {
          saved = localStorage.getItem('audio-splitter:theme')
        } catch (error) {}
        var dark = saved === 'dark'
        if (saved !== 'dark' && saved !== 'light') {
          try {
            dark = matchMedia('(prefers-color-scheme: dark)').matches
          } catch (error) {}
        }
        var root = document.documentElement
        root.dataset.theme = dark ? 'dark' : 'light'
        root.style.colorScheme = root.dataset.theme
      })()
    </script>
